{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ресторани міста{% endblock %}</title>
    <link rel="stylesheet" href="{% static '../static/myapp/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static '../static/style.css' %}">
</head>
<body>

<header class="bg-dark text-white text-center p-4">
    <h1>Ресторани міста</h1>
    <p class="mb-0">Найкращі ресторани вашого міста</p>
</header>

<nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
    <div class="container">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/">Головна</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/about">Про нас</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/contacts">Контакти</a>
                </li>

            </ul>
        </div>
    </div>
</nav>

<main class="container mt-5 mb-5">
    {% block content %}
    {% endblock %}
</main>

<footer class="bg-dark text-white text-center p-3">
    <p class="mb-0">© {{ year }} Ресторани міста</p>
</footer>

<script src="{% static 'myapp/js/bootstrap.bundle.min.js' %}"></script>

</body>
</html>
